services:
  - type: web
    name: white-wolf-voice-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISCORD_TOKEN
        sync: false
      - key: NOTIFICATION_CHANNELS
        sync: false
      - key: NOTIFICATION_CHANNEL_ID
        sync: false
