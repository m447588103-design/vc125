services:
  - type: web
    name: white-wolf-voice-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISCORD_TOKEN
        sync: false
      # Multi-server support - 2 ta way te dite parba:
      # Way 1 (Recommended): JSON mapping guild_id -> channel_id
      # Example: {"123456789012345678": 987654321098765432, "234567890123456789": 876543210987654321}
      - key: NOTIFICATION_CHANNELS
        sync: false
      # Way 2: Old single ID (still works for 1 server)
      - key: NOTIFICATION_CHANNEL_ID
        sync: false
