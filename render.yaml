services:
  - type: web
    name: white-wolf-voice-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      apt-get update -y
      apt-get install -y ffmpeg libopus0 libopus-dev
      ffmpeg -version
      pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISCORD_TOKEN
        sync: false
      - key: NOTIFICATION_CHANNEL_ID
        sync: false
